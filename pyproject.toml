[project]
name = "llm-code-review"
requires-python = ">=3.12"
version = "2.0.0"
license = "GPL-3.0"
dependencies = [
  "absl-py",
  "httpx",
  "langchain",
  "langchain[google-genai]",
  "langchain_mistralai",
  "langchain-ollama",
  "rich",
]

[project.scripts]
llm-code-review = "hooks.code_review:entrypoint"
llm-commit-message = "hooks.generate_commit_msg:entrypoint"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["hooks*"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-code-review"
requires-python = ">=3.12"
version = "1.3.3"
license = "GPL-3.0"
dependencies = [
  "absl-py",
  "httpx",
  "langchain",
  "langchain[google-genai]",
  "langchain_mistralai",
  "langchain-ollama",
  "rich",
]

[project.scripts]
llm-code-review = "hooks.code_review:entrypoint"
llm-commit-message = "hooks.generate_commit_message:entrypoint"

[tool.setuptools]
packages = ["hooks", "hooks.lib"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
